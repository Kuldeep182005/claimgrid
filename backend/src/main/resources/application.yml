server:
  port: 8080

spring:
  application:
    name: claimgrid

  datasource:
    url: jdbc:postgresql://localhost:5432/claimgrid
    username: claimgrid
    password: claimgrid
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.claimgrid: DEBUG
    org.springframework.web.socket: INFO

game:
  cors:
    allowed-origins: ${GAME_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  claim:
    cooldown-ms: 3000
    match-turn-limit: 40
    chat-rate-limit-ms: 1000
    reaction-rate-limit-ms: 500
  bot:
    player-target-weight: 0.65
    own-target-weight: 0.20
    random-target-weight: 0.15
    target-radius: 2
